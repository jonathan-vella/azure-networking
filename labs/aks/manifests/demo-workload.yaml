# Consolidated AKS networking lab workload:
# - Namespace: demo-ns
# - Multi-service HTTP echo backends (echo-red, echo-blue) with ClusterIP services
# - Web deployment (nginxdemos/hello:plain-text) exposed via ClusterIP, Internal LB, and Public LB
apiVersion: v1
kind: Namespace
metadata:
  name: demo-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-red
  namespace: demo-ns
  labels:
    app: echo-red
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-red
  template:
    metadata:
      labels:
        app: echo-red
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args:
            - "-text=echo-red"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo-red
  namespace: demo-ns
spec:
  type: ClusterIP
  selector:
    app: echo-red
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-blue
  namespace: demo-ns
  labels:
    app: echo-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-blue
  template:
    metadata:
      labels:
        app: echo-blue
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args:
            - "-text=echo-blue"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo-blue
  namespace: demo-ns
spec:
  type: ClusterIP
  selector:
    app: echo-blue
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: demo-ns
  labels:
    app: web-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-clusterip
  namespace: demo-ns
spec:
  type: ClusterIP
  selector:
    app: web-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-internal-lb
  namespace: demo-ns
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: web-demo
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-external-lb
  namespace: demo-ns
spec:
  type: LoadBalancer
  selector:
    app: web-demo
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
