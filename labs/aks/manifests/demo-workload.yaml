# Consolidated AKS networking lab workload:
# - Namespace: demo-ns
# - Multi-service HTTP echo backends (echo-red, echo-blue) with ClusterIP services
# - Non-root NGINX demo deployment (nginxdemos/nginx-hello:plain-text on port 8080)
#   exposed via ClusterIP, Internal LoadBalancer, and Public LoadBalancer
apiVersion: v1
kind: Namespace
metadata:
  name: demo-ns
  labels:
    app.kubernetes.io/part-of: aks-networking-labs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-red
  namespace: demo-ns
  labels:
    app: echo-red
    app.kubernetes.io/name: echo-red
    app.kubernetes.io/part-of: aks-networking-labs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-red
  template:
    metadata:
      labels:
        app: echo-red
        app.kubernetes.io/name: echo-red
        app.kubernetes.io/part-of: aks-networking-labs
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args:
            - "-text=echo-red"
            - "-listen=:8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo-red
  namespace: demo-ns
  labels:
    app: echo-red
    app.kubernetes.io/name: echo-red
    app.kubernetes.io/part-of: aks-networking-labs
spec:
  type: ClusterIP
  selector:
    app: echo-red
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-blue
  namespace: demo-ns
  labels:
    app: echo-blue
    app.kubernetes.io/name: echo-blue
    app.kubernetes.io/part-of: aks-networking-labs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-blue
  template:
    metadata:
      labels:
        app: echo-blue
        app.kubernetes.io/name: echo-blue
        app.kubernetes.io/part-of: aks-networking-labs
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args:
            - "-text=echo-blue"
            - "-listen=:8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo-blue
  namespace: demo-ns
  labels:
    app: echo-blue
    app.kubernetes.io/name: echo-blue
    app.kubernetes.io/part-of: aks-networking-labs
spec:
  type: ClusterIP
  selector:
    app: echo-blue
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: demo-ns
  labels:
    app: web-demo
    app.kubernetes.io/name: web-demo
    app.kubernetes.io/part-of: aks-networking-labs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
        app.kubernetes.io/name: web-demo
        app.kubernetes.io/part-of: aks-networking-labs
    spec:
      containers:
        - name: hello
          image: nginxdemos/nginx-hello:plain-text
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-clusterip
  namespace: demo-ns
  labels:
    app: web-demo
    app.kubernetes.io/name: web-demo
    app.kubernetes.io/part-of: aks-networking-labs
spec:
  type: ClusterIP
  selector:
    app: web-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web-internal-lb
  namespace: demo-ns
  labels:
    app: web-demo
    app.kubernetes.io/name: web-demo
    app.kubernetes.io/part-of: aks-networking-labs
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: web-demo
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web-external-lb
  namespace: demo-ns
  labels:
    app: web-demo
    app.kubernetes.io/name: web-demo
    app.kubernetes.io/part-of: aks-networking-labs
spec:
  type: LoadBalancer
  selector:
    app: web-demo
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
