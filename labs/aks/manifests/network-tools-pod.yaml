apiVersion: v1
kind: Pod
metadata:
  name: network-tools
  labels:
    app: network-tools
    app.kubernetes.io/name: network-tools
    app.kubernetes.io/part-of: aks-networking-labs
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: network-tools
      image: nicolaka/netshoot:v0.16
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi

