version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      handbook-deps:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /tools/firewall-monitor/firewall-mon-app
    schedule:
      interval: weekly
    groups:
      firewall-monitor-npm:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: /tools/firewall-monitor/firewall-mon-api
    schedule:
      interval: weekly
    groups:
      firewall-monitor-nuget:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /tools/netbench/dashboard/api
    schedule:
      interval: weekly
    groups:
      netbench-api-npm:
        patterns:
          - "*"
  - package-ecosystem: terraform
    directory: /tools/netbench
    schedule:
      interval: weekly
    groups:
      netbench-terraform:
        patterns:
          - "*"
