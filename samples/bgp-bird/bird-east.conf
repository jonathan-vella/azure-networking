# ==============================================================================
# BIRD 2 Configuration (bird2 on Ubuntu 24.04 LTS, /etc/bird/bird.conf)
#
# Topology:
#   - Local Linux NVA (East): 172.16.25.4/24 (ASN 65001), Azure gateway 172.16.25.1
#   - Azure Route Server (ASN 65515): 172.16.201.4 and 172.16.201.5 (eBGP multihop)
#   - Remote Linux NVA (West): 192.168.100.2 (ASN 65002) over VXLAN ("vxlan-demo",
#     underlay peer 172.17.25.4)
#
# Documentation:
#   https://bird.network.cz/?get_doc&v=20&f=bird.html
# ==============================================================================

log syslog { debug, trace, info, remote, warning, error, auth, fatal, bug };
log stderr all;

# Globally unique IPv4 Router ID (set to this NVA's primary NIC IPv4 address)
router id 172.16.25.4;

# Interface state monitor required by BIRD protocols
protocol device {
  scan time 60;
}

# Synchronize BIRD's master4 table into the Linux OS kernel routing table.
# BIRD 2 requires an explicit ipv4 channel block for import/export directives.
protocol kernel {
  scan time 60;
  ipv4 {
    import none;
    export all;
  };
}

# Static routes in BIRD 2 require an explicit ipv4 channel declaration.
# Pin /32 routes for Azure Route Server and remote VXLAN underlay endpoints via
# the local Azure subnet gateway (172.16.25.1) so originated or learned default
# routes (0.0.0.0/1 + 128.0.0.0/1) never cause BGP next-hop recursion loops.
protocol static {
  ipv4;

  # Azure Route Server instances (prevent tunnel recursion)
  route 172.16.201.4/32 via 172.16.25.1;
  route 172.16.201.5/32 via 172.16.25.1;

  # Remote West NVA underlay IP and test loopback via Azure subnet gateway (.1)
  route 172.17.25.4/32 via 172.16.25.1;
  route 11.11.11.11/32 via 172.16.25.1;

  # Remote West NVA BGP endpoint over VXLAN tunnel interface
  route 192.168.100.2/32 via "vxlan-demo";

  # Split default routes (0.0.0.0/1 + 128.0.0.0/1) originated for lab egress testing
  route 0.0.0.0/1 via 172.16.25.1;
  route 128.0.0.0/1 via 172.16.25.1;
}

# Optional import helper when stripping/replacing AS_PATH in controlled lab topologies
filter from_routeserver {
  bgp_path.empty;
  bgp_path.prepend(65001);
  accept;
}

# Drop /30-/32 host and point-to-point helper prefixes before advertising to
# Azure Route Server (avoids leaking /32 peer pins and protects the 1,000-route limit)
filter to_routeserver {
  if ( net ~ [ 0.0.0.0/0{30,32} ] ) then {
    reject;
  }
  accept;
}

# Shared eBGP template. multihop is mandatory in Azure VNets because packets to
# RouteServerSubnet traverse the Azure SDN subnet gateway (.1).
template bgp PEERS {
  local as 65001;
  multihop;
  ipv4 {
    import all;
    export all;
  };
}

# eBGP session to West NVA (ASN 65002) across unicast VXLAN tunnel
protocol bgp vxlan from PEERS {
  description "Cross-region West NVA over vxlan-demo";
  neighbor 192.168.100.2 as 65002;
}

# eBGP session to Azure Route Server instance 1
protocol bgp routeserver1 from PEERS {
  description "Azure Route Server peer 1";
  neighbor 172.16.201.4 as 65515;
  ipv4 {
    import all;
    # Optional lab override: import filter from_routeserver;
    export filter to_routeserver;
  };
}

# eBGP session to Azure Route Server instance 2
protocol bgp routeserver2 from PEERS {
  description "Azure Route Server peer 2";
  neighbor 172.16.201.5 as 65515;
  ipv4 {
    import all;
    # Optional lab override: import filter from_routeserver;
    export filter to_routeserver;
  };
}

